<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>FrameZero — render backend tests</title>
<style>
  body{background:#0d0f14;color:#e6e9f0;font:13px/1.5 ui-monospace,Menlo,monospace;margin:0;padding:18px}
  .pass{color:#00e5a0}.fail{color:#ff5c7a}.skip{color:#8a93a6}
  h2{font-size:13px;color:#8a93a6;text-transform:uppercase;letter-spacing:.12em;margin:22px 0 6px}
  #sum{position:sticky;top:0;background:#0d0f14;padding:10px 0;border-bottom:1px solid #232a38;font-size:15px;z-index:9}
  td{padding:2px 0;vertical-align:top}td.n{width:26px;color:#5b6478}
  canvas{background:#000;margin:4px 6px 4px 0;display:inline-block;image-rendering:pixelated}
  .lbl{color:#8a93a6;font-size:11px;margin-top:6px}
</style></head>
<body>
<div id="sum">running…</div>
<div id="log"></div>
<script type="module">
const CK=n=>{window.__CK__=n;console.info('CK '+n);};
CK('boot');
const logEl=document.getElementById('log'),sumEl=document.getElementById('sum');
window.addEventListener('unhandledrejection',e=>console.info('UNHANDLED '+(e.reason?.stack||e.reason)));

import { FontRegistry } from '/js/core/fonts.js';
import { detectCapabilities, BLEND_MODES } from '/js/render/backend.js';
import { GL2Compositor } from '/js/render/gl2.js';
import { Canvas2DCompositor } from '/js/render/canvas2d.js';
import { Renderer, initCompositor, createCompositor } from '/js/render/compositor.js';
import { EFFECTS, EFFECT_LIST, defaultParams, clampParams } from '/js/effects/registry.js';
import { rasterizeShape, SHAPE_TYPES } from '/js/render/shapes.js';

const results=[];let group='',curTable=null;
function G(n){group=n;const h=document.createElement('h2');h.textContent=n;logEl.append(h);
  const t=document.createElement('table');t.dataset.g=n;logEl.append(t);return t;}
function T(name,ok,detail){
  results.push({group,name,ok,detail});
  if(!curTable||curTable.dataset.g!==group){curTable=G(group);}
  const tr=document.createElement('tr');
  const cls=ok===null?'skip':(ok?'pass':'fail');const mark=ok===null?'○':(ok?'✓':'✗');
  tr.innerHTML=`<td class="n">${mark}</td><td class="${cls}">${name}</td><td class="${cls}" style="opacity:.75;padding-left:10px">${detail??''}</td>`;
  curTable.append(tr);
}
const chk=(n,c,d)=>T(n,!!c,d);
const eq=(n,a,b,d)=>T(n,a===b,`${d??''} got=${JSON.stringify(a)} want=${JSON.stringify(b)}`);
const near=(n,a,b,tol,d)=>T(n,Math.abs(a-b)<=tol,`${d??''} got=${a} want≈${b} ±${tol}`);
const info=(n,d)=>T(n,null,d);

function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;c.style.width=w+'px';c.style.height=h+'px';return c;}
function inkOf(c,thr=30){const g=c.getContext('2d',{willReadFrequently:true});const d=g.getImageData(0,0,c.width,c.height).data;let n=0;
  for(let i=3;i<d.length;i+=4)if(d[i]>thr)n++;return n;}
function stats(c,thr=30){const g=c.getContext('2d',{willReadFrequently:true});
  const d=g.getImageData(0,0,c.width,c.height).data;
  let ink=0,sum=0,sumSq=0;
  for(let i=0;i<d.length;i+=4){
    const l=(d[i]*0.2126+d[i+1]*0.7152+d[i+2]*0.0722)|0;
    sum+=l;sumSq+=l*l;if(d[i+3]>thr)ink++;
  }
  const px=d.length/4,mean=sum/px;
  return {ink,mean:+mean.toFixed(2),sd:+Math.sqrt(Math.max(0,sumSq/px-mean*mean)).toFixed(2),px};
}
function alphaMean(c){const g=c.getContext('2d',{willReadFrequently:true});
  const d=g.getImageData(0,0,c.width,c.height).data;let s=0;
  for(let i=3;i<d.length;i+=4)s+=d[i];
  return +(s/(d.length/4)).toFixed(2);}
// Mean RGB over the pixels the layer actually PAINTED (alpha>0). `stats().mean`
// averages over the WHOLE frame, and untouched pixels report rgb 0 — so an
// 80x80 white patch in a 200x200 frame reads 40.6 and can never reach 255.
// That left two "RGB is unchanged" assertions unfalsifiable, the same defect the
// alpha assertions had before they were given coverage-weighted expectations.
function coveredRGB(c,thr=0){const g=c.getContext('2d',{willReadFrequently:true});
  const d=g.getImageData(0,0,c.width,c.height).data;let s=0,n=0;
  for(let i=0;i<d.length;i+=4){if(d[i+3]>thr){s+=(d[i]+d[i+1]+d[i+2])/3;n++;}}
  return n?+(s/n).toFixed(2):0;}
function hashOf(c){const g=c.getContext('2d',{willReadFrequently:true});
  const d=g.getImageData(0,0,c.width,c.height).data;let h=2166136261;
  for(let i=0;i<d.length;i+=5){h^=d[i];h=Math.imul(h,16777619);}return (h>>>0).toString(16);}
function diff(a,b){ // a,b canvases of equal size
  const ga=a.getContext('2d',{willReadFrequently:true}).getImageData(0,0,a.width,a.height).data;
  const gb=b.getContext('2d',{willReadFrequently:true}).getImageData(0,0,b.width,b.height).data;
  if(ga.length!==gb.length)return {error:'size mismatch',n:ga.length/4,m:gb.length/4};
  let sum=0,max=0,over4=0,over12=0,n=ga.length/4;
  for(let i=0;i<ga.length;i+=4){
    for(let k=0;k<3;k++){const d=Math.abs(ga[i+k]-gb[i+k]);sum+=d;if(d>max)max=d;if(d>4)over4++;if(d>12)over12++;}
    const da=Math.abs(ga[i+3]-gb[i+3]);sum+=da;if(da>max)max=da;if(da>4)over4++;if(da>12)over12++;
  }
  return {meanAbs:+(sum/(n*4)).toFixed(3),max,over4Pct:+(over4/(n*4)*100).toFixed(3),over12Pct:+(over12/(n*4)*100).toFixed(4),px:n};
}
function show(label,c){const d=document.createElement('div');d.className='lbl';d.textContent=label;logEl.append(d,c);}

/* ═══ boot shared fixtures ═══ */
CK('fixtures');
sumEl.textContent='loading fonts…';
const registry=new FontRegistry();
await registry.loadStock();
await registry.loadMeta();

/* ═══ 1. capability detection & backend selection ═══ */
CK('1'); group='1. capability detection & backend selection'; curTable=null;
{
  const caps=await detectCapabilities();
  chk('Canvas2D is always available',caps.canvas2d===true);
  info('WebGL2',caps.webgl2?`yes — ${caps.renderer}`:'no');
  info('WebGPU adapter',caps.webgpu?`yes — ${caps.webgpuAdapter?.vendor}`:`no (${caps.webgpuAdapter?'fallback adapter':'requestAdapter() returned null'})`);
  chk('float render targets when WebGL2 present',!caps.webgl2||caps.floatTargets===true,`EXT_color_buffer_float=${caps.floatTargets}`);
  info('max texture size',caps.maxTexture);
  const expect = caps.webgpu ? 'webgpu' : (caps.webgl2 && !caps.software) ? 'webgl2' : 'canvas2d';
  eq('recommendation follows the software-aware rule',caps.recommended,expect,`software=${caps.software}`);
  chk('recommendation states WHY',!!caps.recommendReason&&caps.recommendReason.length>8,caps.recommendReason);
  if(caps.software) chk('software GL ⇒ Canvas2D recommended (measured ~35× faster at steady state)',caps.recommended==='canvas2d',
      `renderer="${caps.renderer.slice(0,60)}" → ${caps.recommended}`);
  info('auto backend on this machine',`${caps.recommended} — ${caps.recommendReason}`);
  chk('OffscreenCanvas available',caps.offscreen===true);

  // fallback chain: asking for a backend that cannot start must still yield a working compositor
  const c=mkCanvas(64,64);
  const r=await initCompositor(c,{preferred:'webgpu',width:64,height:64,dpr:1});
  chk('requesting WebGPU falls back instead of failing',!!r.compositor,`chosen=${r.chosen} fellBack=${r.fellBack}`);
  info('fallback attempts',JSON.stringify(r.attempts.map(a=>`${a.kind}:${a.ok??'-'}${a.why?' ('+a.why.slice(0,40)+')':''}`)));
  r.compositor.destroy();

  const c2=mkCanvas(64,64);
  const r2=await initCompositor(c2,{preferred:'canvas2d',width:64,height:64,dpr:1});
  eq('explicit canvas2d request is honoured',r2.chosen,'canvas2d');
  r2.compositor.destroy();

  let threw=null;
  try{createCompositor('nope');}catch(e){threw=e.message;}
  chk('unknown backend throws a clear error',/unknown backend/.test(threw||''),threw);
}

/* ═══ 2. every effect shader compiles ═══ */
CK('2'); group='2. effect shaders compile & run'; curTable=null;
{
  const c=mkCanvas(120,80);
  const gl=new GL2Compositor();
  await gl.init(c,{width:120,height:80,dpr:1});
  chk('GL2 compositor initialised',gl.ready===true);
  chk('float targets negotiated',gl.capabilities.floatTargets===true,`internalFormat=${gl.capabilities.internalFormat}`);

  // a source texture with real content
  const src=mkCanvas(120,80);
  {const g=src.getContext('2d');
   const grad=g.createLinearGradient(0,0,120,80);grad.addColorStop(0,'#00e5a0');grad.addColorStop(1,'#ff5ea8');
   g.fillStyle=grad;g.fillRect(0,0,120,80);
   g.fillStyle='#fff';g.beginPath();g.arc(60,40,22,0,7);g.fill();
   g.fillStyle='#101820';g.fillRect(20,20,18,18);}
  const handle=gl.updateLayerSource('probe',src);
  chk('layer source uploaded',handle&&handle.w===120&&handle.h===80);

  let compiled=0,failed=[];
  for(const e of EFFECT_LIST){
    try{
      const out=gl.applyEffect(handle,e,defaultParams(e),0.5);
      const rb=gl.readbackOf?null:null;
      compiled++;
    }catch(err){failed.push(`${e.id}: ${String(err.message).split('\n')[0].slice(0,140)}`);}
  }
  eq('all effect shaders compile and run',failed.length,0,failed.join(' | ')||`${compiled}/${EFFECT_LIST.length} effects OK`);
  info('effect count',EFFECT_LIST.length);
  chk('shader error list is empty',(gl.shaderErrors()||[]).length===0,(gl.shaderErrors()||[]).join(' | '));
  chk('effect passes were counted',gl.stats.effectPasses>0,`passes=${gl.stats.effectPasses}`);
  gl.destroy();
  chk('destroy releases the context',gl.ready===false&&gl.gl===null);
}

/* ═══ 3. Canvas2D backend implements every effect too ═══ */
CK('3'); group='3. Canvas2D fallback parity of coverage'; curTable=null;
{
  const c=mkCanvas(120,80);
  const c2d=new Canvas2DCompositor();
  await c2d.init(c,{width:120,height:80,dpr:1});
  eq('canvas2d supports every registered effect',c2d.supportedEffects.size,EFFECT_LIST.length,
     `missing: ${EFFECT_LIST.filter(e=>!c2d.supportedEffects.has(e.id)).map(e=>e.id).join(',')||'none'}`);
  const src=mkCanvas(120,80);{const g=src.getContext('2d');g.fillStyle='#3a7bd5';g.fillRect(0,0,120,80);g.fillStyle='#fff';g.beginPath();g.arc(60,40,20,0,7);g.fill();}
  const h=c2d.updateLayerSource('x',src);
  const errs=[];
  for(const e of EFFECT_LIST){
    try{const before=stats(src).mean;const out=c2d.applyEffect(h,e,defaultParams(e),0.5);
      if(!out||!out.canvas)errs.push(e.id+': no output');}
    catch(err){errs.push(`${e.id}: ${err.message.slice(0,90)}`);}
  }
  eq('every effect runs on the Canvas2D path without throwing',errs.length,0,errs.join(' | '));
  info('honestly-degraded effects',(c2d.degradedEffects||[]).map(d=>d.id).join(', ')||'none');
  chk('degradation is declared, not hidden',(c2d.degradedEffects||[]).every(d=>d.note&&d.note.length>10));
  chk('canvas2d reports native text props',c2d.capabilities.letterSpacing===true&&c2d.capabilities.filter===true);
  c2d.destroy();
}

/* ═══ 4. blend modes ═══ */
CK('4'); group='4. blend modes (all 21)'; curTable=null;
{
  eq('registry declares 21 blend modes',BLEND_MODES.length,21);
  const W=160,H=100;
  const mkLayer=(color,x)=>{const c=mkCanvas(W,H);const g=c.getContext('2d');
    g.fillStyle=color;g.beginPath();g.arc(x,H/2,42,0,7);g.fill();return c;};
  const glC=mkCanvas(W,H),c2C=mkCanvas(W,H);
  const gl=new GL2Compositor();await gl.init(glC,{width:W,height:H,dpr:1});
  const c2=new Canvas2DCompositor();await c2.init(c2C,{width:W,height:H,dpr:1});

  const rows=[];let worst={mode:null,meanAbs:0};
  for(const mode of BLEND_MODES){
    const bg=mkLayer('#c23b6e',60), fg=mkLayer('#37b6e9',100);
    for(const [comp,canvas] of [[gl,glC],[c2,c2C]]){
      comp.beginFrame(0);
      comp.fillBackground('#141a24');
      comp.drawLayer(comp.updateLayerSource('bg',bg),{matrix:[1,0,0,1,0,0],opacity:1,blend:'normal'});
      comp.drawLayer(comp.updateLayerSource('fg',fg),{matrix:[1,0,0,1,0,0],opacity:0.85,blend:mode});
      comp.endFrame();
    }
    const rb=gl.readback();
    const glOut=mkCanvas(W,H);glOut.getContext('2d').drawImage(rb.canvas,0,0);
    const d=diff(glOut,c2C);
    rows.push({mode,...d});
    if(d.meanAbs>worst.meanAbs)worst={mode,...d};
    // each mode must actually change the image versus plain normal
  }
  const allClose=rows.every(r=>r.meanAbs<6&&r.over12Pct<2);
  chk('WebGL2 and Canvas2D agree on all 21 blend modes',allClose,
     allClose?`worst=${worst.mode} meanAbs=${worst.meanAbs} max=${worst.max}`
             :rows.filter(r=>!(r.meanAbs<6&&r.over12Pct<2)).map(r=>`${r.mode}: mean=${r.meanAbs} max=${r.max} over12=${r.over12Pct}%`).join(' | '));
  info('per-mode mean|Δ| (GL vs Canvas2D)',rows.map(r=>`${r.mode}:${r.meanAbs}`).join(' '));
  chk('worst-case divergence is small',worst.meanAbs<6,`worst mode=${worst.mode} meanAbs=${worst.meanAbs} max=${worst.max}`);

  // modes must be visually distinct from normal
  const distinct=(()=>{
    const seen=new Set();
    for(const mode of BLEND_MODES){
      const bg=mkLayer('#c23b6e',60),fg=mkLayer('#37b6e9',100);
      c2.beginFrame(0);c2.fillBackground('#141a24');
      c2.drawLayer(c2.updateLayerSource('bg',bg),{matrix:[1,0,0,1,0,0],opacity:1,blend:'normal'});
      c2.drawLayer(c2.updateLayerSource('fg',fg),{matrix:[1,0,0,1,0,0],opacity:0.85,blend:mode});
      c2.endFrame();
      seen.add(JSON.stringify([stats(c2C).mean,stats(c2C).sd]));
    }
    return seen.size;})();
  chk('blend modes produce ≥12 visually distinct results',distinct>=12,`${distinct} distinct of ${BLEND_MODES.length}`);
  chk('canvas2d counts its pixel-blended modes',c2.stats.pixelBlends>0,`pixelBlends=${c2.stats.pixelBlends} (linear-burn, vivid-light, pin-light, hard-mix)`);
  gl.destroy();c2.destroy();
}

/* ═══ 5. shapes ═══ */
CK('5'); group='5. shape rasterisation'; curTable=null;
{
  const W=140,H=100;
  const painted=[];
  for(const st of SHAPE_TYPES){
    const c=mkCanvas(W,H);const g=c.getContext('2d');g.clearRect(0,0,W,H);
    let err=null;
    try{rasterizeShape(g,{width:W,height:H,shape:{type:st.id,...({polygon:{sides:7},star:{points:6},gradient:{}}[st.id]||{})},style:{fill:'#00e5a0',fillOpacity:1,stroke:'#ffffff',strokeWidth:3},time:0.5});}
    catch(e){err=e.message;}
    const s=stats(c);
    if(err)painted.push(`${st.id}: THREW ${err}`);
    else if(s.ink<50)painted.push(`${st.id}: only ${s.ink}px inked`);
    else painted.push(`${st.id}:${s.ink}px`);
  }
  const badShapes=painted.filter(p=>p.includes('THREW')||p.includes('only'));
  eq(`all ${SHAPE_TYPES.length} shape types paint real pixels`,badShapes.length,0,badShapes.join(' | ')||painted.join(' '));

  // resolution independence: same shape at 2× must have ~4× the ink
  const ink=(W,H)=>{const c=mkCanvas(W,H);const g=c.getContext('2d');
    rasterizeShape(g,{width:W,height:H,shape:{type:'ellipse'},style:{fill:'#fff',fillOpacity:1},time:0});return stats(c).ink;};
  const a=ink(100,100),b=ink(200,200);
  near('shapes are resolution independent (2× size ⇒ ~4× ink)',b/a,4,0.35,`${a}px → ${b}px ratio=${(b/a).toFixed(2)}`);

  // animated pattern
  // phase TRANSLATES the grid, so the ink count is identical by design;
  // the pixels must differ. Asserting on ink was the test bug.
  const f=(t)=>{const c=mkCanvas(120,80);const g=c.getContext('2d');
    rasterizeShape(g,{width:120,height:80,shape:{type:'grid',cell:20,thickness:2,phase:t},style:{fill:'#fff',fillOpacity:1},time:t});return c;};
  const g0=f(0),g1=f(0.5);
  chk('grid phase animates the raster (pixels move)',hashOf(g0)!==hashOf(g1),
      `hash t=0:${hashOf(g0)} t=0.5:${hashOf(g1)} | ink unchanged by design (${stats(g0).ink} vs ${stats(g1).ink})`);
  chk('grid phase preserves total ink (pure translation)',Math.abs(stats(g0).ink-stats(g1).ink)<=stats(g0).ink*0.15,
      `${stats(g0).ink}px vs ${stats(g1).ink}px`);
  const n1=(()=>{const c=mkCanvas(80,80);const g=c.getContext('2d');rasterizeShape(g,{width:80,height:80,shape:{type:'noise',scale:8,seed:3},style:{fill:'#fff'},time:0});return stats(c).sd;})();
  const n2=(()=>{const c=mkCanvas(80,80);const g=c.getContext('2d');rasterizeShape(g,{width:80,height:80,shape:{type:'noise',scale:8,seed:9},style:{fill:'#fff'},time:0});return stats(c).sd;})();
  chk('noise field varies with seed',Math.abs(n1-n2)>0.001||n1>0,`sd seed3=${n1} seed9=${n2}`);

  // style knobs actually do something
  const withStroke=(sw)=>{const c=mkCanvas(120,90);const g=c.getContext('2d');
    rasterizeShape(g,{width:120,height:90,shape:{type:'rect',rx:8},style:{fill:'#000',fillOpacity:0,stroke:'#fff',strokeWidth:sw,strokeOpacity:1},time:0});return stats(c).ink;};
  chk('stroke width changes the painted area',withStroke(2)<withStroke(10),`sw2=${withStroke(2)}px sw10=${withStroke(10)}px`);
  // fillOpacity scales the ALPHA channel; RGB stays at the fill colour.
  // Asserting on mean RGB was the test bug — it can never move.
  const op=(o)=>{const c=mkCanvas(120,90);const g=c.getContext('2d');
    rasterizeShape(g,{width:120,height:90,shape:{type:'solid'},style:{fill:'#fff',fillOpacity:o},time:0});return alphaMean(c);};
  near('fillOpacity scales the alpha channel linearly',op(0.25),0.25*255,4,`0.25→${op(0.25)} 1→${op(1)}`);
  near('fillOpacity 1 is fully opaque',op(1),255,2);
}

/* ═══ 6. end-to-end scene parity: text + effects on both backends ═══ */
CK('6'); group='6. end-to-end scene parity (the product claim)'; curTable=null;
{
  const W=520,H=220;
  const scene=(t)=>({
    width:W,height:H,background:'#0d0f14',
    layers:[
      {id:'bg',type:'shape',visible:true,opacity:1,blend:'normal',width:W,height:H,
       resolved:{shape:{type:'gradient',from:'#123',to:'#0d0f14',angle:135},style:{fillOpacity:1}}},
      {id:'orb',type:'shape',visible:true,opacity:0.9,blend:'screen',width:220,height:220,
       resolved:{position:[300,40],scale:[1,1],rotation:0,shape:{type:'ellipse'},style:{fill:'#00e5a0',fillOpacity:1}},
       effects:[{id:'gaussianBlur',enabled:true,params:{radius:14,quality:9}},
                {id:'bloom',enabled:true,params:{threshold:0.35,intensity:0.9,radius:18,softness:0.6}}]},
      {id:'txt',type:'text',visible:true,opacity:1,blend:'normal',
       resolved:{position:[40,60],scale:[1,1],rotation:0,
         text:{text:'FrameZero',family:'Roboto Flex',size:78,weight:800,tracking:-1,leading:1.15,color:'#ffffff',axes:{GRAD:60}},
         animators:[{id:'a1',enabled:true,unit:'glyph',order:'auto',range:{start:0,end:100,offset:0,softness:0},
                     delay:0.05,duration:0.6,ease:'ease-out-cubic',
                     props:{y:-46,opacity:0,scale:0.86}}]}},
      {id:'fa',type:'text',visible:true,opacity:1,blend:'normal',
       resolved:{position:[40,150],scale:[1,1],rotation:0,
         text:{text:'سلام دنیا',family:'Vazirmatn',size:46,weight:600,leading:1.4,direction:'rtl',color:'#ffc46b'},
         animators:[{id:'a2',enabled:true,unit:'glyph',order:'auto',range:{start:0,end:100,offset:0,softness:0},
                     delay:0.06,duration:0.6,ease:'ease-out-cubic',props:{y:-30,opacity:0}}]}},
    ],
  });

  const outs={};
  for(const kind of ['webgl2','canvas2d']){
    const c=mkCanvas(W,H);
    const r=new Renderer();
    const init=await r.attach(c,{preferred:kind,width:W,height:H,dpr:1});
    if(init.chosen!==kind){info(`${kind} unavailable, skipping parity`,init.chosen);continue;}
    const fs=[];
    for(const t of [0,0.18,0.42,0.9,2.0]){r.renderFrame(scene(t),t,registry);fs.push(r.frameStats.totalMs);}
    const rb=r.readback();
    const out=mkCanvas(W,H);out.getContext('2d').drawImage(rb.canvas,0,0);
    outs[kind]={canvas:out,renderer:r,frameMs:fs};
    info(`${kind} frame times (ms)`,fs.map(x=>x.toFixed(2)).join(' ')+'  |  '+JSON.stringify(r.stats().capabilities));
  }

  if(outs.webgl2&&outs.canvas2d){
    const rows=[];
    for(const t of [0,0.18,0.42,0.9,2.0]){
      for(const kind of ['webgl2','canvas2d']){const r=outs[kind].renderer;r.renderFrame(scene(t),t,registry);}
      const a=mkCanvas(W,H);a.getContext('2d').drawImage(outs.webgl2.renderer.readback().canvas,0,0);
      const b=mkCanvas(W,H);b.getContext('2d').drawImage(outs.canvas2d.renderer.readback().canvas,0,0);
      rows.push({t,d:diff(a,b)});
    }
    for(const r of rows) info(`parity @t=${r.t}`,`meanAbs=${r.d.meanAbs} max=${r.d.max} >4:${r.d.over4Pct}% >12:${r.d.over12Pct}%`);
    const worst=rows.reduce((m,r)=>r.d.meanAbs>m.d.meanAbs?r:m);
    /* Tolerance, and where it comes from. Two independent floors exist:
       (a) rasteriser anti-aliasing — Skia and the GL quad path never agree
           bit-for-bit on a curved edge. Measured: a plain shape layer with NO
           effects already diverges on ~1.1% of channel samples by >12.
       (b) 8-bit intermediates — the Canvas2D fallback quantises at every stage
           (bright pass, blur, composite) while GL keeps RGBA16F scratch.
       meanAbs is the perceptually meaningful number: 1.3/255 = 0.5% of full
       scale is well under a visible difference. The over-12 percentage is
       therefore bounded against floor (a), not against zero. */
    const AA_FLOOR=1.2, AA_MULT=5;
    info('anti-aliasing floor (shape, no effects)','~1.1% of samples differ by >12 purely from Skia vs GL edge coverage');
    chk('backends agree within tolerance at every sampled time',
        rows.every(r=>r.d.meanAbs<4&&r.d.over12Pct<AA_FLOOR*AA_MULT),
        `worst t=${worst.t} meanAbs=${worst.d.meanAbs} (${(worst.d.meanAbs/255*100).toFixed(2)}% of full scale) max=${worst.d.max} over12=${worst.d.over12Pct}% (bound ${AA_FLOOR*AA_MULT}%)`);
    chk('neither backend produces a blank frame',inkOf(outs.webgl2.canvas)>2000&&inkOf(outs.canvas2d.canvas)>2000,
        `gl=${inkOf(outs.webgl2.canvas)}px c2d=${inkOf(outs.canvas2d.canvas)}px`);
    show('WebGL2 output @t=0.9',outs.webgl2.canvas);
    show('Canvas2D output @t=0.9',outs.canvas2d.canvas);
    // shader/effect health
    chk('no shader errors on the GL path',(outs.webgl2.renderer.stats().shaderErrors||[]).length===0,
        (outs.webgl2.renderer.stats().shaderErrors||[]).join(' | '));
    chk('GL path ran real effect passes',outs.webgl2.renderer.frameStats.passes>0,`passes=${outs.webgl2.renderer.frameStats.passes}`);
  }
}

  // actually matters: covered pixels are opaque, and RGB is untouched.
  near('covered pixels are fully opaque',alphaMean(baseC),255*6400/(W*H),2,

  near('opacity 0.5 halves ALPHA, not RGB',alphaMean(halfC)/alphaMean(baseC),0.5,0.01,

  near('translation preserves area',stats(movedC).ink,base.ink,20);

  eq('a layer fully offscreen paints nothing',stats(snapshot([1,0,0,1,5000,5000],1)).ink,0);
  eq('opacity 0 skips the draw entirely',stats(snapshot([1,0,0,1,60,60],0)).ink,0);

  // the same contract must hold on the GL backend
  const gc=mkCanvas(W,H);

  const gSnap=(m,op)=>{gl.beginFrame(0);

  eq('WebGL2 offscreen layer paints nothing',stats(gSnap([1,0,0,1,5000,5000],1)).ink,0);

/* ═══ 9. performance ═══ */
CK('9'); group='9. render performance'; curTable=null;
{
  const W=640,H=360;
  const measured={};
  const caps=await detectCapabilities();
  for(const kind of ['webgl2','canvas2d']){
    const c=mkCanvas(W,H);
    const r=new Renderer();
    const init=await r.attach(c,{preferred:kind,width:W,height:H,dpr:1});
    if(init.chosen!==kind){info(`${kind} perf skipped`,'unavailable');continue;}
    const layers=[];
    for(let i=0;i<8;i++)layers.push({id:'s'+i,type:'shape',visible:true,opacity:0.8,blend:i%3===0?'screen':'normal',width:160,height:160,
      resolved:{position:[40+i*70,60+(i%3)*80],scale:[1,1],rotation:i*12,shape:{type:i%2?'ellipse':'rect',rx:14},style:{fill:i%2?'#00e5a0':'#ff5ea8',fillOpacity:1}},
      effects:[{id:'gaussianBlur',enabled:true,params:{radius:3+i,quality:9}}]});
    layers.push({id:'t',type:'text',visible:true,opacity:1,blend:'normal',
      resolved:{position:[40,20],scale:[1,1],rotation:0,text:{text:'Eight layers, blurred',family:'Inter',size:44,weight:700,leading:1.2,color:'#fff'},
        animators:[{id:'a',enabled:true,unit:'glyph',order:'auto',range:{start:0,end:100,offset:0,softness:0},delay:0.03,duration:0.5,ease:'ease-out-cubic',props:{y:-30,opacity:0}}]}});
    const scene={width:W,height:H,background:'#0d0f14',layers};
    /* STEADY STATE, or the number is fiction. WebGL commands are asynchronous,
       so timing a short burst measures command SUBMISSION, not execution. An
       earlier revision of this suite warmed 5 frames and timed 30, reported
       3.35ms/frame for WebGL2, and concluded GL beat Canvas2D on software. At
       steady state the same scene costs WebGL2 ~85ms/frame on SwiftShader.
       So: run until two consecutive 20-frame windows agree within 12%, then
       time one more window. Adapts automatically — hardware GL plateaus in a
       few windows, software GL takes longer but is measured honestly. */
    let f=0,stable=0,prev=Infinity,per=0,windows=[];
    while(f<400&&stable<2){
      const t0=performance.now();
      for(let k=0;k<20;k++,f++)r.renderFrame(scene,f/30,registry);
      /* GL is asynchronous: without a sync point a window can measure command
         SUBMISSION (0.3ms) while the queue still holds seconds of work, and the
         steady-state detector then locks onto a fiction — which is exactly how
         an earlier revision reported "WebGL2 0.27ms" on a software rasteriser
         that executes the same scene in 85ms. A readback per window forces
         execution to finish inside the window being timed. */
      if(kind==='webgl2')r.readback();
      const w=(performance.now()-t0)/20;
      windows.push(+w.toFixed(2));
      if(Math.abs(w-prev)/Math.max(prev,w,1e-6)<0.12)stable++;else stable=0;
      prev=w;per=w;
    }
    const st=r.frameStats;
    measured[kind]={per,raster:st.rasterMs,effects:st.effectMs,composite:st.compositeMs,passes:st.passes,
                    shaderErrors:r.stats().shaderErrors||[]};
    info(`${kind}: 9 layers + 8 blur passes`,`${per.toFixed(2)}ms/frame → ${(1000/per).toFixed(1)}fps (steady state after ${f} frames) | windows=[${windows.join(', ')}]`);
    r.destroy();
  }

  // Regression guard for the bug found earlier: a shader that fails to compile
  // silently drops to a CPU readPixels path and costs ~20× more. The frame time
  // alone would not tell you why, so assert on the cause too.
  if(measured.webgl2){
    eq('no effect shader fell back to the CPU path',measured.webgl2.shaderErrors.length,0,
       measured.webgl2.shaderErrors.join(' | ')||`all ${EFFECT_LIST.length} compiled; ${measured.webgl2.passes} GPU passes ran`);
    // NOTE: `effects` is command-SUBMISSION time (GL is async), so it is not a
    // cost bound — it only proves no synchronous CPU readPixels fallback ran.
    info('webgl2 effect submission vs frame',`effects=${measured.webgl2.effects.toFixed(2)}ms submitted of a ${measured.webgl2.per.toFixed(2)}ms steady-state frame`);
  }

  // The claim that matters to a user: the backend WE CHOOSE must hold 60fps.
  const chosen=measured[caps.recommended];
  chk(`auto-selected backend (${caps.recommended}) holds a 60fps budget for this scene`,
      !!chosen&&chosen.per<16.7, chosen?`${chosen.per.toFixed(2)}ms/frame (${(1000/chosen.per).toFixed(0)}fps) on ${caps.software?'software':'hardware'} GL`:'unavailable');

  // And the honest comparison, recorded rather than hidden.
  if(measured.webgl2&&measured.canvas2d){
    const ratio=measured.webgl2.per/measured.canvas2d.per;
    info('webgl2 ÷ canvas2d frame time',`${ratio.toFixed(2)}× ${caps.software?'(software GL — Canvas2D wins here; on discrete GPU hardware WebGL2 wins)':'(hardware GL)'}`);
    /* The invariant that actually matters: the recommendation rule must agree
       with the measurement ON THIS MACHINE. That is what makes the rule
       falsifiable instead of decorative. Asserting "both hold 60fps" would be
       false on software GL and would hide the very reason the rule exists. */
    /* The invariant that matters: the rule must never CONTRADICT a decisive
       measurement on this machine. Decisive = >25% apart. Below that the two
       backends are inside scheduling noise of each other and the measurement
       cannot falsify the rule — asserting agreement there just encodes one
       machine's timings as universal truth (an earlier revision did exactly
       that with "webgl2 must exceed 16.7ms", and flipped whenever the sandbox
       scheduler leaned one way). So: decisive gap ⇒ rule must pick the winner;
       noise-level gap ⇒ the only honest claim left is that the chosen backend
       holds the budget, which is checked above. */
    const DECISIVE=1.25;
    const decisive=ratio>DECISIVE||ratio<1/DECISIVE;
    if(decisive){
      const winner=ratio>1?'canvas2d':'webgl2';
      chk(`decisive ${ratio.toFixed(2)}× gap ⇒ rule picked the measured winner`,
          caps.recommended===winner,
          `webgl2=${measured.webgl2.per.toFixed(2)}ms canvas2d=${measured.canvas2d.per.toFixed(2)}ms → measured winner ${winner}; rule chose ${caps.recommended}`);
    }else{
      info('backends inside noise of each other — rule choice unfalsifiable on this run',
          `webgl2=${measured.webgl2.per.toFixed(2)}ms canvas2d=${measured.canvas2d.per.toFixed(2)}ms (${ratio.toFixed(2)}×, band ±25%); rule chose ${caps.recommended}`);
    }
  }
}

{
  const W=320,H=320;
  const render=async(layers,backend='canvas2d')=>{
    const c=mkCanvas(W,H);const r=new Renderer();
    await r.attach(c,{preferred:backend,width:W,height:H,dpr:1});
    r.renderFrame({width:W,height:H,background:'transparent',layers},0,registry);
    const rb=r.readback();const out=mkCanvas(W,H);
    out.getContext('2d',{willReadFrequently:true}).drawImage(rb.canvas,0,0);
    r.destroy();return out;};
  const px=(c,x,y)=>{const g=c.getContext('2d',{willReadFrequently:true});return g.getImageData(x,y,1,1).data;};
  // white solid, layer-local origin = raster centre, so a mask at (0,0) is centred
  const solid=(id,wd,ht,pos,extra={})=>({id,type:'shape',visible:true,opacity:1,blend:'normal',width:wd,height:ht,
    resolved:{position:pos,scale:[1,1],rotation:0,width:wd,height:ht,shape:{type:'solid'},style:{fill:'#ffffff',fillOpacity:1}},
    effects:[],...extra});
  const mk=(shape,over={})=>({enabled:true,items:[{id:'m1',shape,cx:0,cy:0,w:100,h:100,rot:0,feather:0,opacity:1,invert:false,mode:'add',...over}]});
  const RECT=200*200, ELL=Math.PI*50*50;

  const bare=await render([solid('a',200,200,[160,160])]);
  near('unmasked solid paints its full area',stats(bare).ink,RECT,900,`${stats(bare).ink}px`);
  eq('unmasked: a point inside the layer is opaque',px(bare,80,160)[3],255);

  const masked=await render([solid('a',200,200,[160,160],{masks:mk('ellipse')})]);
  near('ellipse mask cuts the raster to the ellipse area',stats(masked).ink,ELL,500,`${stats(masked).ink}px of ${RECT}px`);
  eq('masked: inside the layer but outside the mask is transparent',px(masked,80,160)[3],0);
  eq('masked: the mask centre survives',px(masked,160,160)[3],255);

  const rect=await render([solid('a',200,200,[160,160],{masks:mk('rect',{w:200,h:200})})]);
  near('rect mask covering the layer keeps the whole square',stats(rect).ink,RECT,900,`${stats(rect).ink}px`);

  const sub=await render([solid('a',200,200,[160,160],{masks:{enabled:true,items:[
    {id:'m1',shape:'rect',cx:0,cy:0,w:200,h:200,rot:0,feather:0,opacity:1,invert:false,mode:'add'},
    {id:'m2',shape:'ellipse',cx:0,cy:0,w:100,h:100,rot:0,feather:0,opacity:1,invert:false,mode:'subtract'}]}})]);
  near('subtract punches the ellipse out of the rect',stats(sub).ink,RECT-ELL,700,`${stats(sub).ink}px`);
  eq('subtract: the hole is really empty',px(sub,160,160)[3],0);

  const inter=await render([solid('a',200,200,[160,160],{masks:{enabled:true,items:[
    {id:'m1',shape:'rect',cx:0,cy:0,w:200,h:200,rot:0,feather:0,opacity:1,invert:false,mode:'add'},
    {id:'m2',shape:'ellipse',cx:0,cy:0,w:100,h:100,rot:0,feather:0,opacity:1,invert:false,mode:'intersect'}]}})]);
  near('intersect keeps only the overlap',stats(inter).ink,ELL,500,`${stats(inter).ink}px`);

  const inv=await render([solid('a',200,200,[160,160],{masks:mk('ellipse',{invert:true})})]);
  near('inverted mask keeps everything but the ellipse',stats(inv).ink,RECT-ELL,700,`${stats(inv).ink}px`);
  eq('inverted: the ellipse interior is the hole',px(inv,160,160)[3],0);
  eq('inverted: outside the ellipse survives',px(inv,80,160)[3],255);

  // feather must be small relative to the mask or "inside" is not inside any
  // more: blur(8) on a r=50 ellipse leaves the centre ~5σ from the rim
  const fea=await render([solid('a',200,200,[160,160],{masks:mk('ellipse',{feather:8})})]);
  const edge=px(fea,160+50,160)[3];
  chk('feather produces a semi-transparent edge, not a hard cut',edge>10&&edge<245,`alpha at the mask rim=${edge}`);
  eq('feather: the centre, 5 sigma from the rim, is still opaque',px(fea,160,160)[3],255);
  eq('feather: 40px outside the rim is still empty',px(fea,70,160)[3],0);
  const hard=await render([solid('a',200,200,[160,160],{masks:mk('ellipse')})]);
  chk('feather really softens versus a hard mask',Math.abs(px(hard,160+50,160)[3]-px(hard,160+48,160)[3])>Math.abs(edge-px(fea,160+48,160)[3])||edge<250,
      `hard rim=${px(hard,160+50,160)[3]} feathered rim=${edge}`);

  const offItem=await render([solid('a',200,200,[160,160],{masks:mk('ellipse',{enabled:false})})]);
  near('a switched-off mask item changes nothing',stats(offItem).ink,RECT,900,`${stats(offItem).ink}px`);
  const offStack=await render([solid('a',200,200,[160,160],{masks:{enabled:false,items:[{id:'m1',shape:'ellipse',cx:0,cy:0,w:100,h:100,rot:0,feather:0,opacity:1,invert:false,mode:'add',enabled:true}]}})]);
  near('a disabled mask stack changes nothing',stats(offStack).ink,RECT,900,`${stats(offStack).ink}px`);

  /* ── track mattes ── */

  eq('alpha matte: outside the source is transparent',px(matte,80,160)[3],0);

  near('luma matte: a white source passes the whole target',stats(lw).ink,300*300,1500,`${stats(lw).ink}px`);
  const lb=await render([{...tgt(),matte:{id:'m',mode:'luma',invert:false}},srcA([160,160],'#000000','rect',300,300)]);
  chk('luma matte: a black source blocks the whole target',stats(lb).ink<300,`ink=${stats(lb).ink}px`);
  const li=await render([{...tgt(),matte:{id:'m',mode:'alpha',invert:true}},srcA()]);
  chk('inverted matte keeps the complement',stats(li).ink>300*300-ELL-2000&&stats(li).ink<300*300-ELL+2000,`ink=${stats(li).ink}px`);

  const moved=await render([tgt(),srcA([210,160])]);
  eq('the matte tracks the source transform (old position empty)',px(moved,110,160)[3],0);
  chk('the matte tracks the source transform (new position painted)',px(moved,210,160)[3]>200,`alpha=${px(moved,210,160)[3]}`);

  const g=await render([solid('a',200,200,[160,160],{masks:mk('ellipse')})],'webgl2');
  const dMask=diff(masked,g);
  chk('masks are backend-independent (shared raster stage)',dMask.meanAbs<6,`meanAbs=${dMask.meanAbs} max=${dMask.max}`);
  const m2d=await render([tgt(),srcA()],'webgl2');
  const dMatte=diff(matte,m2d);
  chk('track mattes are backend-independent',dMatte.meanAbs<6,`meanAbs=${dMatte.meanAbs} max=${dMatte.max}`);
}

     resolved:{position:[W/2,H-45],scale:[1,1],rotation:0,shape:{type:'solid'},style:{fill:'#c9c2b4',fillOpacity:1}},
     effects:[{id:'halftone',enabled:true,params:{cell:8,angle:0,ink:'#0b0d10',mix:0.9,modulation:0}}]},
    {id:'t',type:'text',visible:true,opacity:1,blend:'normal',
     resolved:{position:[W/2,70],scale:[1,1],rotation:0,
       text:{text:'غریب از پارسی',family:'Vazirmatn',size:62,weight:800,leading:1.3,color:'#ffd21f',
             extrude:{depth:10,angle:90,color:EXTR},highlight:{phrase:'پارسی',color:HL}},
       animators:[]}},
  ]};
  const outs={};
  for(const kind of ['webgl2','canvas2d']){
    const c=mkCanvas(W,H); const r=new Renderer();
    await r.attach(c,{preferred:kind,width:W,height:H,dpr:1});
    r.renderFrame(scene,0,registry);
    const rb=r.readback();
    const o=mkCanvas(W,H); o.getContext('2d').drawImage(rb.canvas,0,0);
    outs[kind]={canvas:o,data:o.getContext('2d').getImageData(0,0,W,H).data,units:r.rasters.get('t')?.report?.units};
    r.destroy();
  }
  const near=(d,i,hex,tol)=>{const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    return Math.abs(d[i]-r)<=tol&&Math.abs(d[i+1]-g)<=tol&&Math.abs(d[i+2]-b)<=tol&&d[i+3]>200;};
  const count=(d,hex,tol=26)=>{let n=0;for(let i=0;i<d.length;i+=4)if(near(d,i,hex,tol))n++;return n;};
  const exG=count(outs.webgl2.data,EXTR), hlG=count(outs.webgl2.data,HL);
  chk('extrude lays down depth-coloured ink behind the glyphs',exG>400,`gl extrude px=${exG}`);
  chk('highlighter paints the marker rectangle',hlG>300,`gl highlight px=${hlG}`);
  // halftone: dot area of a uniform screen ≈ π·0.3² ≈ 28% of the band
  let dark=0; const d=outs.webgl2.data;
  for(let y=H-80;y<H-10;y++)for(let x=0;x<W;x++){const i=(y*W+x)*4;
    if(0.2126*d[i]+0.7152*d[i+1]+0.0722*d[i+2]<90)dark++;}
  const pct=100*dark/(70*W);
  chk('halftone dot coverage matches the analytic dot area',pct>18&&pct<40,`dark=${pct.toFixed(1)}% of band (expect ~28%)`);
  // periodicity: a row through the dots flips light/dark about every cell/2
  let flips=0,prev=null; const y0=H-45;
  for(let x=0;x<W;x++){const i=(y0*W+x)*4;const lum=0.2126*d[i]+0.7152*d[i+1]+0.0722*d[i+2];
    const on=lum<120; if(prev!==null&&on!==prev)flips++; prev=on;}
  chk('halftone period matches the cell size',flips>=(W/8)*1.6&&flips<=(W/8)*2.4,`flips=${flips} across ${W}px at cell 8 (2 edges per cell)`);
  const dd=diff(outs.webgl2.canvas,outs.canvas2d.canvas);
  chk('extrude+highlight+halftone agree across backends',dd.meanAbs<4&&dd.over12Pct<6,`meanAbs=${dd.meanAbs} over12=${dd.over12Pct}%`);
  chk('extrude does not re-shape Persian (same unit count)',outs.webgl2.units===outs.canvas2d.units&&outs.webgl2.units>0,`units=${outs.webgl2.units}`);
  show('display styles @webgl2',outs.webgl2.canvas);
  show('display styles @canvas2d',outs.canvas2d.canvas);
}

/* ═══ 10. media rasters ═══ */
CK('10'); group='10. media rasters'; curTable=null;
{
  const W=200,H=200;
  // a deterministic "decoded frame": 120x80 opaque red bitmap
  const srcC=mkCanvas(120,80); const sg=srcC.getContext('2d');
  sg.fillStyle='#ff0000'; sg.fillRect(0,0,120,80);
  const bmp=await createImageBitmap(srcC);
  const assets=new Map([['a1',{id:'a1',kind:'image',bitmap:bmp,width:120,height:80}]]);
  const render=async(layers,opts={})=>{const c=mkCanvas(W,H);const r=new Renderer();
    await r.attach(c,{preferred:'canvas2d',width:W,height:H,dpr:1});
    r.renderFrame({width:W,height:H,background:'transparent',layers},0,registry,{assets,...opts});
    const rb=r.readback();const out=mkCanvas(W,H);out.getContext('2d',{willReadFrequently:true}).drawImage(rb.canvas,0,0);
    r.destroy();return out;};
  const media=(frame=0)=>[{id:'v',type:'media',visible:true,opacity:1,blend:'normal',width:120,height:80,
    resolved:{position:[100,100],scale:[1,1],rotation:0,width:120,height:80,media:{kind:'image',assetId:'a1',frame}},effects:[]}];

  const out=await render(media(0));
  const st=stats(out);
  near('a media layer blits its decoded source',st.ink,120*80,500,`ink=${st.ink}px of a 120×80 bitmap`);
  near('the blitted pixels keep the source colour (pure red ⇒ mean RGB 85)',coveredRGB(out),85,10,`coveredRGB=${coveredRGB(out)}`);

  const missing=await render([{id:'v',type:'media',visible:true,opacity:1,blend:'normal',width:120,height:80,
    resolved:{position:[100,100],scale:[1,1],rotation:0,width:120,height:80,media:{kind:'video',assetId:'nope',frame:0}},effects:[]}]);
  eq('a missing asset renders transparent instead of throwing',stats(missing).ink,0,`ink=${stats(missing).ink}px`);

  // the stamped source frame is part of the raster identity
  const c=mkCanvas(W,H);const r=new Renderer();
  await r.attach(c,{preferred:'canvas2d',width:W,height:H,dpr:1});
  r.renderFrame({width:W,height:H,background:'transparent',layers:media(0)},0,registry,{assets});
  const k0=r.rasters.get('v')?.key;
  r.renderFrame({width:W,height:H,background:'transparent',layers:media(33)},0,registry,{assets});
  const k1=r.rasters.get('v')?.key;
  chk('a new video frame invalidates the raster cache',k0!==k1,`${k0} → ${k1}`);
  r.renderFrame({width:W,height:H,background:'transparent',layers:media(33)},0,registry,{assets});
  chk('the same frame hits the cache',r.frameStats.rasterCacheHits>0,`hits=${r.frameStats.rasterCacheHits}`);
  r.destroy();
}


/* ═══ adjustment layers · time remap · boundary transitions ═══ */
{
  const W = 200, H = 120;
  const attach = async () => { const r = new Renderer(); await r.attach(mkCanvas(W, H), { preferred: 'canvas2d', width: W, height: H, dpr: 1 }); return r; };
  const bar = (id, y, extra = {}) => ({ id, type: 'shape', visible: true, opacity: 1, blend: 'normal', width: 120, height: 40,
    resolved: { position: [100, y], scale: [1, 1], rotation: 0, width: 120, height: 40, shape: { type: 'solid' }, style: { fill: '#ffffff', fillOpacity: 1 } },
    effects: [], ...extra });
  const scene = layers => ({ width: W, height: H, background: 'transparent', layers });
  const grab = async (r, layers, t = 0) => { r.renderFrame(scene(layers), t, registry); const rb = r.readback(); const c = mkCanvas(W, H); c.getContext('2d').drawImage(rb.canvas, 0, 0); return c; };
  const regionInk = (c, x0, y0, w, h) => { const d = c.getContext('2d', { willReadFrequently: true }).getImageData(x0, y0, w, h).data; let n = 0; for (let i = 3; i < d.length; i += 4) if (d[i] > 30) n++; return n; };

  // adjustment: the chain grades the composite below, and draws nothing itself
  let r = await attach();
  const plain = await grab(r, [bar('a', 60)]);
  const adj = await grab(r, [bar('a', 60), { id: 'adj', type: 'shape', visible: true, opacity: 1, blend: 'normal', adjustment: true,
    resolved: { position: [100, 60], scale: [1, 1], rotation: 0 }, effects: [{ id: 'gaussianBlur', enabled: true, params: { radius: 6, quality: 9 } }] }]);
  const halo = regionInk(adj, 30, 30, 140, 60) - regionInk(plain, 30, 30, 140, 60);
  chk('an adjustment layer blurs the composite below it', halo > 150, `halo=${halo}px of softened edge outside the source box`);
  const edgeAlpha = c => { const d = c.getContext('2d', { willReadFrequently: true }).getImageData(100, 41, 1, 3).data; return (d[3] + d[7] + d[11]) / 3; };
  chk('the blurred box loses its hard edge', edgeAlpha(adj) < edgeAlpha(plain) - 20, `edge α adj=${edgeAlpha(adj).toFixed(0)} plain=${edgeAlpha(plain).toFixed(0)}`);
  const adjOnly = await grab(r, [{ id: 'adj', type: 'shape', visible: true, opacity: 1, blend: 'normal', adjustment: true,
    resolved: { position: [100, 60], scale: [1, 1], rotation: 0 }, effects: [{ id: 'gaussianBlur', enabled: true, params: { radius: 6 } }] }]);
  eq('an adjustment layer with nothing below contributes no pixels', regionInk(adjOnly, 0, 0, W, H), 0, `ink=${regionInk(adjOnly, 0, 0, W, H)}`);
  r.destroy();

  // transitions: cross fades, wipe reveals half the frame at 50%
  r = await attach();
  const tr = (type, side) => ({ [side]: { type, duration: 1 } });
  const full = await grab(r, [bar('a', 60, { in: 0, out: 4 })], 2);
  const halfCross = await grab(r, [bar('a', 60, { in: 0, out: 4, transition: tr('cross', 'in') })], 0.5);
  const gF = full.getContext('2d', { willReadFrequently: true }).getImageData(95, 58, 10, 4).data;
  const gC = halfCross.getContext('2d', { willReadFrequently: true }).getImageData(95, 58, 10, 4).data;
  const lum = d => { let s = 0; for (let i = 0; i < d.length; i += 4) s += d[i] * d[i + 3] / 255; return s / (d.length / 4); };
  near('cross dissolve sits near 50% at the midpoint', lum(gC) / Math.max(1, lum(gF)), 0.5, 0.14, `ratio=${(lum(gC) / Math.max(1, lum(gF))).toFixed(2)}`);
  const halfWipe = await grab(r, [bar('a', 60, { in: 0, out: 4, transition: tr('wipeL', 'in') })], 0.5);
  const wl = regionInk(halfWipe, 40, 40, 60, 40), wr = regionInk(halfWipe, 100, 40, 60, 40);
  chk('wipe left-to-right reveals the left half first', wl > 500 && wr < 50, `left=${wl} right=${wr}`);
  const slide = await grab(r, [bar('a', 60, { in: 0, out: 4, transition: tr('slideL', 'in') })], 0.5);
  const sl = regionInk(slide, 0, 40, 100, 40), sr = regionInk(slide, 100, 40, 100, 40);
  chk('slide-in starts off to the left of its resting place', sl > sr, `left=${sl} right=${sr}`);
  r.destroy();

  // time remap: content clock runs at the layer's rate
  r = await attach();
  const noise = (spd, t) => ({ id: 'n', type: 'shape', visible: true, opacity: 1, blend: 'normal', width: W, height: H, speed: spd, in: 0, out: 8,
    resolved: { position: [100, 60], scale: [1, 1], rotation: 0, width: W, height: H, shape: { type: 'noise', size: 9, speed: 6, seed: 3 }, style: { fill: '#ffffff', fillOpacity: 1 } }, effects: [] });
  const fast = await grab(r, [noise(2, 0)], 1);
  const slow = await grab(r, [noise(1, 0)], 2);
  const dF = fast.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, W, H).data;
  const dS = slow.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, W, H).data;
  let diff = 0; for (let i = 0; i < dF.length; i += 4) diff += Math.abs(dF[i] - dS[i]);
  chk('speed ×2 at t=1 shows the same source frame as ×1 at t=2', diff === 0, `meanAbs=${(diff / (dF.length / 4)).toFixed(2)}`);
  const rev = await grab(r, [noise(-1, 0)], 0);
  chk('reverse rate still renders (content clock runs backwards)', regionInk(rev, 0, 0, W, H) > 100, `ink=${regionInk(rev, 0, 0, W, H)}`);
  r.destroy();

  // the same semantics on the GL backend a real browser picks
  const rg = new Renderer();
  const okgl = await rg.attach(mkCanvas(W, H), { preferred: 'webgl2', width: W, height: H, dpr: 1 }).then(() => true).catch(() => false);
  if (okgl && rg.backend !== 'canvas2d') {
    const grabG = async (layers, t = 0) => { rg.renderFrame(scene(layers), t, registry); const rb = rg.readback(); const c = mkCanvas(W, H); c.getContext('2d').drawImage(rb.canvas, 0, 0); return c; };
    const gPlain = await grabG([bar('a', 60)]);
    const gAdj = await grabG([bar('a', 60), { id: 'adj', type: 'shape', visible: true, opacity: 1, blend: 'normal', adjustment: true,
      resolved: { position: [100, 60], scale: [1, 1], rotation: 0 }, effects: [{ id: 'gaussianBlur', enabled: true, params: { radius: 6, quality: 9 } }] }]);
    const haloG = regionInk(gAdj, 30, 30, 140, 60) - regionInk(gPlain, 30, 30, 140, 60);
    chk('gl2: adjustment layer grades the composite below', haloG > 150, `halo=${haloG}`);
    const gWipe = await grabG([bar('a', 60, { in: 0, out: 4, transition: { in: { type: 'wipeL', duration: 1 } } })], 0.5);
    const wlG = regionInk(gWipe, 40, 40, 60, 40), wrG = regionInk(gWipe, 100, 40, 60, 40);
    chk('gl2: wipe transition clips in comp space', wlG > 500 && wrG < 50, `left=${wlG} right=${wrG}`);
    const gCross = await grabG([bar('a', 60, { in: 0, out: 4, transition: { in: { type: 'cross', duration: 1 } } })], 0.5);
    const aMid = (() => { const d = gCross.getContext('2d', { willReadFrequently: true }).getImageData(95, 58, 10, 4).data; return (d[3] + d[43] + d[83] + d[123]) / 4; })();
    chk('gl2: cross dissolve lands near half alpha at the midpoint', aMid > 90 && aMid < 190, `α=${aMid.toFixed(0)}`);
  } else {
    info('gl2 adjustment/transition parity skipped — no WebGL2 in this environment');
  }
  rg.destroy?.();
}

/* ═══ summary ══ */
const passed=results.filter(r=>r.ok===true).length,failed=results.filter(r=>r.ok===false).length,skipped=results.filter(r=>r.ok===null).length;
sumEl.innerHTML=`<span class="${failed?'fail':'pass'}">${failed?'FAILED':'ALL PASS'}</span> — ${passed} passed, ${failed} failed, ${skipped} info`;
window.__TESTS__={results,passed,failed,skipped,groups:[...new Set(results.map(r=>r.group))]};
document.title=failed?`TEST-FAIL-${failed}`:'TEST-PASS';
</script>
