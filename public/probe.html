<!doctype html><html><head><meta charset="utf-8"><title>probe</title></head><body>
<canvas id="c" width="1200" height="700"></canvas>
<pre id="out"></pre>
<script type="module">
const out = document.getElementById('out');
const log = (...a) => { const s = a.join(' '); out.textContent += s + '\n'; console.log(s); };

async function loadFont(family, url, descriptors = {}) {
  const buf = await (await fetch(url)).arrayBuffer();
  const ff = new FontFace(family, buf, descriptors);
  await ff.load();
  document.fonts.add(ff);
  return ff;
}

const R = {};
try {
  await loadFont('RF', '/fonts/RobotoFlex-var.ttf', { weight: '100 1000', stretch: '25% 151%' });
  await loadFont('VZ', '/fonts/Vazirmatn-var.woff2', { weight: '100 900' });
  await loadFont('IT', '/fonts/Inter-var.ttf', { weight: '100 900' });
  await loadFont('NSA', '/fonts/NotoSansArabic-var.ttf', { weight: '100 900', stretch: '62.5% 100%' });
  await document.fonts.ready;
  R.fontsLoaded = [...document.fonts].map(f => f.family + ':' + f.status);
  log('fonts loaded:', R.fontsLoaded.join(', '));
} catch (e) { log('FONT LOAD ERROR:', e.message); }

const cv = document.getElementById('c'), ctx = cv.getContext('2d');

// ── TEST 1: does numeric weight in ctx.font drive the wght axis? ──
function widthWith(fontStr, text, extra = {}) {
  ctx.save();
  ctx.font = fontStr;
  for (const k in extra) ctx[k] = extra[k];
  const w = ctx.measureText(text).width;
  ctx.restore();
  return w;
}
R.t1_wght = {};
for (const w of [100, 300, 400, 700, 900, 1000]) {
  R.t1_wght[w] = +widthWith(`${w} 64px RF`, 'HANDGLOVES').toFixed(3);
}
log('T1 wght axis -> measured widths:', JSON.stringify(R.t1_wght));
R.t1_verdict = new Set(Object.values(R.t1_wght)).size > 3 ? 'VARIABLE-OK' : 'STATIC-BROKEN';
log('T1 verdict:', R.t1_verdict);

// ── TEST 2: ctx.fontStretch driving wdth axis ──
R.t2_wdth = {};
for (const s of ['25%', '62.5%', '100%', '151%']) {
  R.t2_wdth[s] = +widthWith(`400 64px RF`, 'HANDGLOVES', { fontStretch: s }).toFixed(3);
}
log('T2 fontStretch -> widths:', JSON.stringify(R.t2_wdth));
R.t2_verdict = new Set(Object.values(R.t2_wdth)).size > 2 ? 'WDTH-OK' : 'WDTH-UNSUPPORTED';
log('T2 verdict:', R.t2_verdict);

// ── TEST 2b: font-stretch inside the shorthand ──
R.t2b = {};
for (const s of ['condensed', 'normal', 'expanded', '75%', '125%']) {
  try { R.t2b[s] = +widthWith(`400 ${s} 64px RF`, 'HANDGLOVES').toFixed(3); } catch (e) { R.t2b[s] = 'ERR:' + e.message.slice(0, 30); }
}
log('T2b shorthand stretch:', JSON.stringify(R.t2b));

// ── TEST 3: oblique angle driving slnt axis ──
R.t3_slnt = {};
for (const st of ['normal', 'italic', 'oblique', 'oblique -10deg', 'oblique -5deg']) {
  try { R.t3_slnt[st] = +widthWith(`${st} 400 64px RF`, 'Handgloves').toFixed(3); } catch (e) { R.t3_slnt[st] = 'ERR:' + e.message.slice(0, 30); }
}
log('T3 slnt/style:', JSON.stringify(R.t3_slnt));

// ── TEST 4: pixel proof — render wght 100 vs 900 and count dark pixels ──
function inkOf(fontStr, text, extra = {}) {
  ctx.save(); ctx.fillStyle = '#000'; ctx.clearRect(0, 0, 400, 120);
  ctx.font = fontStr; for (const k in extra) ctx[k] = extra[k];
  ctx.fillText(text, 10, 80);
  const d = ctx.getImageData(0, 0, 400, 120).data;
  let n = 0; for (let i = 3; i < d.length; i += 4) if (d[i] > 40) n++;
  ctx.restore(); return n;
}
R.t4_ink = { w100: inkOf('100 64px RF', 'HANDGLOVES'), w400: inkOf('400 64px RF', 'HANDGLOVES'), w900: inkOf('900 64px RF', 'HANDGLOVES') };
log('T4 ink pixels by weight:', JSON.stringify(R.t4_ink));
R.t4_verdict = (R.t4_ink.w900 > R.t4_ink.w100 * 1.5) ? 'INK-SCALES-WITH-WGHT' : 'NO-VISUAL-CHANGE';
log('T4 verdict:', R.t4_verdict);

// ── TEST 5: Persian/Arabic shaping (are letters joined?) ──
const FA = 'سلام دنیا';  // سلام دنیا
function joinedOK(fontStr, text) {
  // If shaping works, "سلام" is narrower than the sum of its isolated letters
  const shaped = inkOf(fontStr, text);
  // isolated forms = insert ZWSP-free spaces between letters to force isolation
  const isolated = inkOf(fontStr, [...text].filter(c => c !== ' ').join(' '));
  return { shaped, isolated, ratio: +(shaped / Math.max(1, isolated)).toFixed(3) };
}
R.t5_vazirmatn = joinedOK('400 48px VZ', FA);
R.t5_noto = joinedOK('400 48px NSA', FA);
R.t5_inter = joinedOK('400 48px IT', FA);
log('T5 Persian shaping ink (Vazirmatn):', JSON.stringify(R.t5_vazirmatn));
log('T5 Persian shaping ink (NotoArabic):', JSON.stringify(R.t5_noto));
log('T5 Persian shaping ink (Inter=no coverage):', JSON.stringify(R.t5_inter));
R.t5_verdict = R.t5_vazirmatn.shaped > 100 ? 'SHAPING-OK' : 'SHAPING-FAIL';
log('T5 verdict:', R.t5_verdict);

// ── TEST 6: ctx.direction + RTL alignment ──
ctx.clearRect(0,0,1200,700);
ctx.fillStyle = '#111'; ctx.fillRect(0,0,1200,700);
ctx.textBaseline = 'alphabetic';
ctx.fillStyle = '#00e5a0'; ctx.font = '400 40px VZ'; ctx.direction = 'rtl'; ctx.textAlign = 'right';
ctx.fillText('سلام دنیا — FrameZero', 1160, 80);
ctx.fillStyle = '#00b3ff'; ctx.font = '400 40px VZ'; ctx.direction = 'ltr'; ctx.textAlign = 'left';
ctx.fillText('Mixed مختلط ۱۲۳ text', 40, 150);
ctx.fillStyle = '#ff5ea8'; ctx.font = '900 56px RF'; ctx.direction = 'ltr';
ctx.fillText('wght 900 wdth 151', 40, 240);
ctx.fillStyle = '#a78bfa'; ctx.font = '100 56px RF';
ctx.fillText('wght 100', 40, 310);
R.t6_rtlBBox = (() => { ctx.font='400 40px VZ'; ctx.direction='rtl'; ctx.textAlign='right'; const m=ctx.measureText('سلام دنیا'); return { w:+m.width.toFixed(2), al:+m.actualBoundingBoxLeft.toFixed(2), ar:+m.actualBoundingBoxRight.toFixed(2) }; })();
log('T6 RTL measure:', JSON.stringify(R.t6_rtlBBox));

// ── TEST 7: letterSpacing / wordSpacing / fontKerning / textRendering support ──
R.t7 = {};
for (const p of ['letterSpacing','wordSpacing','fontKerning','fontStretch','textRendering','direction','filter']) {
  R.t7[p] = (p in ctx) ? 'supported' : 'MISSING';
}
log('T7 canvas props:', JSON.stringify(R.t7));
try { ctx.letterSpacing='4px'; R.t7.letterSpacingApplied = ctx.letterSpacing; } catch(e){ R.t7.letterSpacingApplied='ERR'; }
log('T7 letterSpacing roundtrip:', R.t7.letterSpacingApplied);

// ── TEST 8: WebGPU availability ──
R.t8_webgpu = !!(navigator.gpu);
log('T8 navigator.gpu:', R.t8_webgpu);
if (navigator.gpu) {
  try {
    const ad = await navigator.gpu.requestAdapter();
    R.t8_adapter = ad ? { vendor: ad.info?.vendor, arch: ad.info?.architecture, isFallback: ad.isFallbackAdapter } : null;
    if (ad) { const dev = await ad.requestDevice(); R.t8_device = !!dev; R.t8_limits = { maxTextureDimension2D: dev.limits.maxTextureDimension2D, maxBufferSize: dev.limits.maxBufferSize }; }
    log('T8 adapter:', JSON.stringify(R.t8_adapter), 'device:', R.t8_device, JSON.stringify(R.t8_limits||{}));
  } catch (e) { R.t8_err = e.message; log('T8 ERROR:', e.message); }
}

// ── TEST 9: FontFace variationSettings descriptor ──
R.t9 = {};
try {
  const buf = await (await fetch('/fonts/RobotoFlex-var.ttf')).arrayBuffer();
  const ff = new FontFace('RFx', buf, { weight: '100 1000', variationSettings: "'GRAD' 150, 'XOPQ' 175" });
  await ff.load(); document.fonts.add(ff);
  const w1 = widthWith('400 64px RFx', 'HANDGLOVES');
  const w0 = widthWith('400 64px RF', 'HANDGLOVES');
  R.t9 = { withVS: w1, without: w0, differs: Math.abs(w1 - w0) > 0.5 };
  log('T9 FontFace variationSettings:', JSON.stringify(R.t9));
} catch (e) { R.t9 = { error: e.message }; log('T9 ERROR:', e.message); }

// ── TEST 10: OffscreenCanvas + ImageBitmap (needed for GPU upload) ──
R.t10 = { OffscreenCanvas: typeof OffscreenCanvas !== 'undefined', createImageBitmap: typeof createImageBitmap === 'function' };
log('T10:', JSON.stringify(R.t10));

window.__PROBE__ = R;
document.title = 'PROBE-DONE';
</script></body></html>
