<!doctype html><html><head><meta charset="utf-8"><title>perf2</title></head><body>
<pre id="o"></pre><script type="module">
const o=document.getElementById('o');const log=(...a)=>{o.textContent+=a.join(' ')+'\n';};
const R={};
import { Renderer } from '/js/render/compositor.js';
import { FontRegistry } from '/js/core/fonts.js';
const registry=new FontRegistry(); await registry.loadStock(); await registry.loadMeta();

const W=640,H=360;
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const layers=[];
for(let i=0;i<8;i++)layers.push({id:'s'+i,type:'shape',visible:true,opacity:0.8,blend:i%3===0?'screen':'normal',width:160,height:160,
  resolved:{position:[40+i*70,60+(i%3)*80],scale:[1,1],rotation:i*12,shape:{type:i%2?'ellipse':'rect',rx:14},style:{fill:i%2?'#00e5a0':'#ff5ea8',fillOpacity:1}},
  effects:[{id:'gaussianBlur',enabled:true,params:{radius:3+i,quality:9}}]});
const scene={width:W,height:H,background:'#0d0f14',layers};   // shapes only: no text, no animator

const mkR=async(kind)=>{const c=mk(W,H);const r=new Renderer();const init=await r.attach(c,{preferred:kind,width:W,height:H,dpr:1});
  return init.chosen===kind?r:null;};

/* Isolate: does WebGL2 degrade on its own, or only when interleaved with a
   live 2D-canvas backend? And which sub-step of composite carries the cost? */
async function run(label, kind, frames, other){
  const r=await mkR(kind);
  if(!r){log(`${label}: ${kind} unavailable`);return;}
  for(let f=0;f<10;f++)r.renderFrame(scene,f/30,registry);
  const chunks=[];
  for(let c0=0;c0<frames;c0+=40){
    const t0=performance.now();
    for(let f=c0;f<Math.min(frames,c0+40);f++){
      r.renderFrame(scene,f/30,registry);
      if(other)other.renderFrame(scene,f/30,registry);   // interleave every frame
    }
    const dt=(performance.now()-t0)/Math.min(40,frames-c0);
    chunks.push(+dt.toFixed(2));
  }
  const st=r.frameStats;
  R[label]={chunks,raster:st.rasterMs,effects:st.effectMs,composite:st.compositeMs,
            uploads:st.uploads,passes:st.passes,hits:st.rasterCacheHits,draws:st.draws};
  log(`${label.padEnd(34)} per-40-frame ms: [${chunks.join(', ')}]`);
  log(`${''.padEnd(34)} last: raster=${st.rasterMs.toFixed(2)} effects=${st.effectMs.toFixed(2)} composite=${st.compositeMs.toFixed(2)} uploads=${st.uploads} passes=${st.passes} cacheHits=${st.rasterCacheHits}`);
  r.destroy();
  return r;
}

log('— A: WebGL2 ALONE, 240 frames (is there an internal leak?) —');
await run('webgl2 alone','webgl2',240,null);

log('\n— B: Canvas2D ALONE, 240 frames —');
await run('canvas2d alone','canvas2d',240,null);

log('\n— C: WebGL2 with a Canvas2D backend driven EVERY frame (interleaved) —');
{
  const g=await mkR('webgl2'), c2=await mkR('canvas2d');
  if(g&&c2){
    for(let f=0;f<10;f++){g.renderFrame(scene,f/30,registry);c2.renderFrame(scene,f/30,registry);}
    const chunks=[];
    for(let c0=0;c0<240;c0+=40){
      const t0=performance.now();
      for(let f=c0;f<c0+40;f++){g.renderFrame(scene,f/30,registry);c2.renderFrame(scene,f/30,registry);}
      chunks.push(+((performance.now()-t0)/40).toFixed(2));
    }
    R.interleaved={chunks,glComposite:g.frameStats.compositeMs,c2Composite:c2.frameStats.compositeMs};
    log(`${'interleaved (both per frame)'.padEnd(34)} per-40-frame ms: [${chunks.join(', ')}]`);
    log(`${''.padEnd(34)} gl composite=${g.frameStats.compositeMs.toFixed(2)}  c2d composite=${c2.frameStats.compositeMs.toFixed(2)}`);
    g.destroy();c2.destroy();
  }
}

log('\n— D: WebGL2 alone but WITHOUT the 3 screen-blended layers (native path only) —');
{
  const nativeOnly={width:W,height:H,background:'#0d0f14',layers:layers.filter(l=>l.blend==='normal')};
  const r=await mkR('webgl2');
  if(r){
    for(let f=0;f<10;f++)r.renderFrame(nativeOnly,f/30,registry);
    const chunks=[];
    for(let c0=0;c0<240;c0+=40){const t0=performance.now();
      for(let f=c0;f<c0+40;f++)r.renderFrame(nativeOnly,f/30,registry);
      chunks.push(+((performance.now()-t0)/40).toFixed(2));}
    R.nativeOnly=chunks;
    log(`${'webgl2, normal-blend only'.padEnd(34)} per-40-frame ms: [${chunks.join(', ')}]`);
    log(`${''.padEnd(34)} last: composite=${r.frameStats.compositeMs.toFixed(2)} draws=${r.frameStats.draws}`);
    r.destroy();
  }
}
window.__PERF2__=R;document.title='PERF2-DONE';
</script></body></html>
