<!doctype html><html><head><meta charset="utf-8"><title>p6</title></head><body>
<pre id="o"></pre><script type="module">
const o=document.getElementById('o');const log=(...a)=>{o.textContent+=a.join(' ')+'\n';};
const R={rows:[]};
import { Renderer } from '/js/render/compositor.js';
import { FontRegistry } from '/js/core/fonts.js';
// renderFrame(scene, time, registry) takes a FONT registry; effect definitions
// are resolved internally from the EFFECTS module table.
const registry = new FontRegistry();
await registry.loadStock();
await registry.loadMeta();

const W=520,H=220;
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};

/* The test-6 scene, but with the effect set parameterised so each stage of the
   orb's pipeline can be measured in isolation. The parity gap is identical at
   every sampled time, so it cannot come from the animated text — it must come
   from the static orb (blurred + bloomed ellipse, screen blend, opacity 0.9). */
const ORB_EFFECTS={
  none: [],
  blur: [{id:'gaussianBlur',enabled:true,params:{radius:14,quality:9}}],
  bloom:[{id:'bloom',enabled:true,params:{threshold:0.35,intensity:0.9,radius:18,softness:0.6}}],
  both: [{id:'gaussianBlur',enabled:true,params:{radius:14,quality:9}},
         {id:'bloom',enabled:true,params:{threshold:0.35,intensity:0.9,radius:18,softness:0.6}}],
};

const scene=(withOrb, effects, orbBlend='screen', orbOpacity=0.9)=>({
  width:W,height:H,background:'#0d0f14',
  layers:[
    {id:'bg',type:'shape',visible:true,opacity:1,blend:'normal',width:W,height:H,
     resolved:{shape:{type:'gradient',from:'#123',to:'#0d0f14',angle:135},style:{fillOpacity:1}}},
    ...(withOrb?[{id:'orb',type:'shape',visible:true,opacity:orbOpacity,blend:orbBlend,width:220,height:220,
     resolved:{position:[300,40],scale:[1,1],rotation:0,shape:{type:'ellipse'},style:{fill:'#00e5a0',fillOpacity:1}},
     effects}]:[]),
  ],
});

const renderers={};
for(const kind of ['webgl2','canvas2d']){
  const c=mk(W,H);
  const r=new Renderer();
  const init=await r.attach(c,{preferred:kind,width:W,height:H,dpr:1});
  if(init.chosen!==kind){log(`${kind} UNAVAILABLE (got ${init.chosen})`);continue;}
  renderers[kind]={r,c};
}

/* Compare two canvases the way the suite does. */
function diff(a,b){
  const ga=a.getContext('2d',{willReadFrequently:true}), gb=b.getContext('2d',{willReadFrequently:true});
  const A=ga.getImageData(0,0,W,H).data, B=gb.getImageData(0,0,W,H).data;
  let sum=0,max=0,over4=0,over12=0,n=0;
  for(let i=0;i<A.length;i+=4){
    for(let k=0;k<3;k++){
      const d=Math.abs(A[i+k]-B[i+k]);
      sum+=d; if(d>max)max=d; if(d>4)over4++; if(d>12)over12++; n++;
    }
  }
  return {meanAbs:+(sum/n).toFixed(3),max,over4Pct:+(100*over4/n).toFixed(2),over12Pct:+(100*over12/n).toFixed(2)};
}
/* Per-backend mean RGB over the whole frame, to see WHICH side is brighter. */
function meanRGB(cv){
  const d=cv.getContext('2d',{willReadFrequently:true}).getImageData(0,0,W,H).data;
  let s=0,n=0; for(let i=0;i<d.length;i+=4){s+=d[i]+d[i+1]+d[i+2];n+=3;}
  return +(s/n).toFixed(2);
}
const snap=(k)=>{const rb=renderers[k].r.readback();const c=mk(W,H);c.getContext('2d').drawImage(rb.canvas,0,0);return c;};

const CASES=[
  ['bg only (no orb)',            scene(false,[])],
  ['orb, NO effects',             scene(true,ORB_EFFECTS.none)],
  ['orb + gaussianBlur(14)',      scene(true,ORB_EFFECTS.blur)],
  ['orb + bloom',                 scene(true,ORB_EFFECTS.bloom)],
  ['orb + blur + bloom  ← scene', scene(true,ORB_EFFECTS.both)],
  ['orb blur+bloom, normal blend',scene(true,ORB_EFFECTS.both,'normal',1)],
];

for(const [label,sc] of CASES){
  for(const k of Object.keys(renderers)) renderers[k].r.renderFrame(sc,0,registry);
  const A=snap('webgl2'), B=snap('canvas2d');
  const d=diff(A,B);
  R.rows.push({label,...d,glMean:meanRGB(A),c2dMean:meanRGB(B)});
  log(`${label.padEnd(30)} meanAbs=${String(d.meanAbs).padStart(8)} max=${String(d.max).padStart(4)} >12:${String(d.over12Pct).padStart(6)}%   glRGB=${meanRGB(A)} c2dRGB=${meanRGB(B)}`);
}

/* If bloom is the culprit, does it converge when its radius shrinks? */
log('\n— bloom radius sweep (orb + blur + bloom) —');
R.sweep=[];
for(const radius of [0,4,9,18,30]){
  const sc=scene(true,[{id:'gaussianBlur',enabled:true,params:{radius:14,quality:9}},
                       {id:'bloom',enabled:true,params:{threshold:0.35,intensity:0.9,radius,softness:0.6}}]);
  for(const k of Object.keys(renderers)) renderers[k].r.renderFrame(sc,0,registry);
  const d=diff(snap('webgl2'),snap('canvas2d'));
  R.sweep.push({radius,...d});
  log(`  bloom radius=${String(radius).padStart(2)}  meanAbs=${String(d.meanAbs).padStart(8)}  max=${String(d.max).padStart(4)}  >12:${d.over12Pct}%`);
}

/* And a blur-radius sweep, in case the edge/extent handling is what differs. */
log('\n— gaussianBlur radius sweep (orb + blur only) —');
R.blurSweep=[];
for(const radius of [0,2,7,14,28]){
  const sc=scene(true,[{id:'gaussianBlur',enabled:true,params:{radius,quality:9}}]);
  for(const k of Object.keys(renderers)) renderers[k].r.renderFrame(sc,0,registry);
  const d=diff(snap('webgl2'),snap('canvas2d'));
  R.blurSweep.push({radius,...d});
  log(`  blur radius=${String(radius).padStart(2)}  meanAbs=${String(d.meanAbs).padStart(8)}  max=${String(d.max).padStart(4)}  >12:${d.over12Pct}%`);
}

log('\ngl shader errors:', JSON.stringify(renderers.webgl2?.r.stats().shaderErrors||[]));
window.__P6__=R;document.title='P6-DONE';
</script></body></html>
