<!doctype html><html><head><meta charset="utf-8"><title>p7</title></head><body>
<pre id="o"></pre><script type="module">
const o=document.getElementById('o');const log=(...a)=>{o.textContent+=a.join(' ')+'\n';};
const R={rows:[]};
import { Renderer } from '/js/render/compositor.js';
import { FontRegistry } from '/js/core/fonts.js';
const registry=new FontRegistry(); await registry.loadStock(); await registry.loadMeta();

const W=520,H=220;
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};

/* probe6 localised the failure to: layer WITH an effect pass + NON-NATIVE blend.
   blur radius=0 still fails, and GL is always the darker side. These cases
   separate the three candidate variables: opacity, blend nativeness, and the
   scratch-texture path. A no-op effect isolates the path from the blur maths. */
const BLUR=(r)=>[{id:'gaussianBlur',enabled:true,params:{radius:r,quality:9}}];
const NOOP=[{id:'brightnessContrast',enabled:true,params:{brightness:0,contrast:0,saturation:0}}];

const scene=(effects,blend,opacity)=>({
  width:W,height:H,background:'#0d0f14',
  layers:[
    {id:'bg',type:'shape',visible:true,opacity:1,blend:'normal',width:W,height:H,
     resolved:{shape:{type:'gradient',from:'#123',to:'#0d0f14',angle:135},style:{fillOpacity:1}}},
    {id:'orb',type:'shape',visible:true,opacity,blend,width:220,height:220,
     resolved:{position:[300,40],scale:[1,1],rotation:0,shape:{type:'ellipse'},style:{fill:'#00e5a0',fillOpacity:1}},
     effects},
  ],
});

const renderers={};
for(const kind of ['webgl2','canvas2d']){
  const c=mk(W,H); const r=new Renderer();
  const init=await r.attach(c,{preferred:kind,width:W,height:H,dpr:1});
  if(init.chosen!==kind){log(`${kind} UNAVAILABLE (got ${init.chosen})`);continue;}
  renderers[kind]={r,c};
}
function diff(a,b){
  const A=a.getContext('2d',{willReadFrequently:true}).getImageData(0,0,W,H).data;
  const B=b.getContext('2d',{willReadFrequently:true}).getImageData(0,0,W,H).data;
  let sum=0,max=0,over12=0,n=0;
  for(let i=0;i<A.length;i+=4)for(let k=0;k<3;k++){const d=Math.abs(A[i+k]-B[i+k]);sum+=d;if(d>max)max=d;if(d>12)over12++;n++;}
  return {meanAbs:+(sum/n).toFixed(3),max,over12Pct:+(100*over12/n).toFixed(2)};
}
function meanRGB(cv){const d=cv.getContext('2d',{willReadFrequently:true}).getImageData(0,0,W,H).data;let s=0,n=0;for(let i=0;i<d.length;i+=4){s+=d[i]+d[i+1]+d[i+2];n+=3;}return +(s/n).toFixed(2);}
const snap=(k)=>{const rb=renderers[k].r.readback();const c=mk(W,H);c.getContext('2d').drawImage(rb.canvas,0,0);return c;};

const CASES=[
  ['no effects · screen · op1',      scene([],'screen',1)],
  ['no effects · screen · op0.9',    scene([],'screen',0.9)],
  ['NO-OP effect · screen · op1',    scene(NOOP,'screen',1)],
  ['NO-OP effect · normal · op1',    scene(NOOP,'normal',1)],
  ['NO-OP effect · multiply · op1',  scene(NOOP,'multiply',1)],
  ['blur14 · screen · op1',          scene(BLUR(14),'screen',1)],
  ['blur14 · screen · op0.9',        scene(BLUR(14),'screen',0.9)],
  ['blur14 · normal · op1',          scene(BLUR(14),'normal',1)],
  ['blur14 · normal · op0.9',        scene(BLUR(14),'normal',0.9)],
  ['blur14 · add · op1  (NATIVE)',   scene(BLUR(14),'add',1)],
  ['blur14 · multiply · op1',        scene(BLUR(14),'multiply',1)],
];
for(const [label,sc] of CASES){
  for(const k of Object.keys(renderers)) renderers[k].r.renderFrame(sc,0,registry);
  const A=snap('webgl2'),B=snap('canvas2d'),d=diff(A,B);
  R.rows.push({label,...d,glMean:meanRGB(A),c2dMean:meanRGB(B)});
  log(`${label.padEnd(32)} meanAbs=${String(d.meanAbs).padStart(8)} max=${String(d.max).padStart(4)} >12:${String(d.over12Pct).padStart(6)}%   gl=${String(meanRGB(A)).padStart(6)} c2d=${String(meanRGB(B)).padStart(6)}`);
}
log('\ngl shader errors:',JSON.stringify(renderers.webgl2?.r.stats().shaderErrors||[]));
window.__P7__=R;document.title='P7-DONE';
</script></body></html>
