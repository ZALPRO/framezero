<!doctype html><html><head><meta charset="utf-8"><title>p5</title></head><body>
<pre id="o"></pre><script type="module">
const o=document.getElementById('o');const log=(...a)=>{o.textContent+=a.join(' ')+'\n';};
const R={};
import { GL2Compositor } from '/js/render/gl2.js';
import { Canvas2DCompositor } from '/js/render/canvas2d.js';
const W=64,H=48;
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};

// opaque backdrop + opaque source ⇒ alpha maths cannot be the explanation
const BG=[194,59,110], FG=[55,182,233];
const bg=mk(W,H);{const g=bg.getContext('2d');g.fillStyle=`rgb(${BG})`;g.fillRect(0,0,W,H);}
const fg=mk(W,H);{const g=fg.getContext('2d');g.fillStyle=`rgb(${FG})`;g.fillRect(0,0,W,H);}

// ── W3C reference, computed in plain JS ──
const lum=c=>0.2126*c[0]+0.7152*c[1]+0.0722*c[2];
const satOf=c=>Math.max(...c)-Math.min(...c);
function clipColor(c){const l=lum(c),n=Math.min(...c),x=Math.max(...c);let r=c.slice();
  if(n<0){const k=l/Math.max(1e-6,l-n);r=r.map(v=>l+(v-l)*k);}
  if(x>1){const k=(1-l)/Math.max(1e-6,x-l);r=r.map(v=>l+(v-l)*k);}
  return r.map(v=>Math.min(1,Math.max(0,v)));}
const setLum=(c,l)=>clipColor(c.map(v=>v+l-lum(c)));
function setSat(c,s){const mn=Math.min(...c),mx=Math.max(...c);if(mx-mn<1e-6)return[0,0,0];const k=s/(mx-mn);return c.map(v=>(v-mn)*k);}
const Df=b=>b<=0.25?((16*b-12)*b+4)*b:Math.sqrt(Math.max(0,b));
const MODES={
  'soft-light':(b,s)=>s.map((sv,i)=>{const bv=b[i];return sv<=0.5?bv-(1-2*sv)*bv*(1-bv):bv+(2*sv-1)*(Df(bv)-bv);}),
  'hue':(b,s)=>setLum(setSat(s,satOf(b)),lum(b)),
  'saturation':(b,s)=>setLum(setSat(b,satOf(s)),lum(b)),
  'color':(b,s)=>setLum(s,lum(b)),
  'luminosity':(b,s)=>setLum(b,lum(s)),
  'multiply':(b,s)=>b.map((v,i)=>v*s[i]),
  'screen':(b,s)=>b.map((v,i)=>v+s[i]-v*s[i]),
  // Overlay(Cb,Cs) = HardLight(Cs,Cb): branch on Cb (backdrop), not Cs
  'overlay':(b,s)=>b.map((v,i)=>{const sv=s[i];return v<=0.5?2*v*sv:sv+(2*v-1)-sv*(2*v-1);}),
};
const b01=BG.map(v=>v/255), s01=FG.map(v=>v/255);

const glC=mk(W,H), c2C=mk(W,H);
const gl=new GL2Compositor(); await gl.init(glC,{width:W,height:H,dpr:1});
const c2=new Canvas2DCompositor(); await c2.init(c2C,{width:W,height:H,dpr:1});
const px=(c)=>{const g=c.getContext('2d',{willReadFrequently:true});const d=g.getImageData(W>>1,H>>1,1,1).data;return [d[0],d[1],d[2],d[3]];};

R.rows=[];
for(const mode of Object.keys(MODES)){
  // expected
  const exp=MODES[mode](b01,s01).map(v=>Math.round(Math.min(1,Math.max(0,v))*255));
  // GL
  gl.beginFrame(0); gl.fillBackground('#000000');
  gl.drawLayer(gl.updateLayerSource('bg',bg),{matrix:[1,0,0,1,0,0],opacity:1,blend:'normal'});
  gl.drawLayer(gl.updateLayerSource('fg',fg),{matrix:[1,0,0,1,0,0],opacity:1,blend:mode});
  gl.endFrame();
  const glpx=px((()=>{const rb=gl.readback();const c=mk(W,H);c.getContext('2d').drawImage(rb.canvas,0,0);return c;})());
  // Canvas2D
  c2.beginFrame(0); c2.fillBackground('#000000');
  c2.drawLayer(c2.updateLayerSource('bg',bg),{matrix:[1,0,0,1,0,0],opacity:1,blend:'normal'});
  c2.drawLayer(c2.updateLayerSource('fg',fg),{matrix:[1,0,0,1,0,0],opacity:1,blend:mode});
  c2.endFrame();
  const c2px=px(c2C);
  const dGl=Math.max(...exp.map((v,i)=>Math.abs(v-glpx[i])));
  const dC2=Math.max(...exp.map((v,i)=>Math.abs(v-c2px[i])));
  R.rows.push({mode,exp,gl:glpx.slice(0,3),c2d:c2px.slice(0,3),maxErrGL:dGl,maxErrC2D:dC2});
  log(`${mode.padEnd(12)} expected=[${exp}]  gl=[${glpx.slice(0,3)}] Δ${dGl}  c2d=[${c2px.slice(0,3)}] Δ${dC2}`);
}
R.glWinsSoftLight = R.rows.find(r=>r.mode==='soft-light');
log('\npixelBlends counter (canvas2d):', c2.stats.pixelBlends);
log('gl shader errors:', JSON.stringify(gl.shaderErrors()));
window.__P5__=R;document.title='P5-DONE';
</script></body></html>
