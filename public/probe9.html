<!doctype html><html><head><meta charset="utf-8"><title>p9</title></head><body>
<pre id="o"></pre><script type="module">
const o=document.getElementById('o');const log=(...a)=>{o.textContent+=a.join(' ')+'\n';};
const R={};
import { Renderer } from '/js/render/compositor.js';
import { FontRegistry } from '/js/core/fonts.js';
const registry=new FontRegistry(); await registry.loadStock(); await registry.loadMeta();

const W=520,H=220;
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const BLUR=(r)=>[{id:'gaussianBlur',enabled:true,params:{radius:r,quality:9}}];
const scene=(effects,blend,opacity)=>({
  width:W,height:H,background:'#0d0f14',
  layers:[
    {id:'bg',type:'shape',visible:true,opacity:1,blend:'normal',width:W,height:H,
     resolved:{shape:{type:'gradient',from:'#123',to:'#0d0f14',angle:135},style:{fillOpacity:1}}},
    {id:'orb',type:'shape',visible:true,opacity,blend,width:220,height:220,
     resolved:{position:[300,40],scale:[1,1],rotation:0,shape:{type:'ellipse'},style:{fill:'#00e5a0',fillOpacity:1}},
     effects},
  ],
});

const rs={};
for(const kind of ['webgl2','canvas2d']){
  const c=mk(W,H); const r=new Renderer();
  const init=await r.attach(c,{preferred:kind,width:W,height:H,dpr:1});
  if(init.chosen===kind) rs[kind]=r; else log(kind+' unavailable');
}
const grab=(k)=>{const rb=rs[k].readback();const c=mk(W,H);c.getContext('2d').drawImage(rb.canvas,0,0);
  return c.getContext('2d',{willReadFrequently:true}).getImageData(0,0,W,H).data;};

for(const [label,blend,fx] of [['blur14 + SCREEN','screen',BLUR(14)],['blur14 + NORMAL','normal',BLUR(14)]]){
  for(const k of Object.keys(rs)) rs[k].renderFrame(scene(fx,blend,1),0,registry);
  const A=grab('webgl2'),B=grab('canvas2d');

  // coarse map of where the two disagree: each cell is 20x20 px, '#' = maxΔ>12
  log(`\n══ ${label} ══  (comp ${W}x${H}, orb rect x∈[300,520] y∈[40,260]→clipped at 220)`);
  let map='';
  for(let y=0;y<H;y+=20){
    let row='';
    for(let x=0;x<W;x+=20){
      let m=0;
      for(let dy=0;dy<20&&y+dy<H;dy++)for(let dx=0;dx<20&&x+dx<W;dx++){
        const i=((y+dy)*W+(x+dx))*4;
        for(let k=0;k<3;k++)m=Math.max(m,Math.abs(A[i+k]-B[i+k]));
      }
      row += m>12?'#' : m>4?'+' : m>0?'.' : ' ';
    }
    map+=`  y=${String(y).padStart(3)} |${row}|\n`;
  }
  log(map);

  // numeric samples: background, orb core, orb edge, blur fringe outside the rect
  const pts=[[50,200,'bg far'],[310,50,'orb TL inside'],[410,150,'orb centre'],[500,200,'orb BR inside'],
             [295,150,'LEFT of orb rect'],[410,35,'ABOVE orb rect'],[410,215,'BELOW orb rect (past comp)'],
             [280,20,'outside both']];
  for(const [x,y,what] of pts){
    if(y>=H||x>=W){log(`  ${what.padEnd(26)} (out of comp)`);continue;}
    const i=(y*W+x)*4;
    log(`  ${what.padEnd(26)} @${x},${y}  gl=[${A[i]},${A[i+1]},${A[i+2]},${A[i+3]}]  c2d=[${B[i]},${B[i+1]},${B[i+2]},${B[i+3]}]`);
  }
  R[label]={};
}
window.__P9__=R;document.title='P9-DONE';
</script></body></html>
